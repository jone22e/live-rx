# Exemplo de proxy reverso no servidor (fora do Docker), com TLS terminado aqui.
# Substitua live.exemplo.com e os caminhos dos certificados. A porta 3012 é a publicada pelo compose.

server {
    listen 80;
    server_name live.exemplo.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name live.exemplo.com;

    ssl_certificate     /etc/letsencrypt/live/live.exemplo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/live.exemplo.com/privkey.pem;

    # WebSocket de signaling: precisa do upgrade e de timeouts longos (há heartbeat a cada 25 s).
    location /ws {
        proxy_pass http://127.0.0.1:3012;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Site, API REST (/api) e /health
    location / {
        proxy_pass http://127.0.0.1:3012;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
